<rect x="60" y="44" width="324" height="36" rx="18" fill="#34d399" fill-opacity=".14" stroke="#34d399" stroke-opacity=".6"/><circle cx="78" cy="62" r="4" fill="#34d399"><animate attributeName="r" values="3;6;3" dur="1.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="94" y="67" class="m" font-size="14" font-weight="700" letter-spacing="1.5" fill="#34d399">OPEN TO BUILD · LEARN · SHIP</text>
<text x="60" y="190" class="s" font-size="74" font-weight="800" fill="url(#ttl)" letter-spacing="-1.5">Sahil Ali Bhutto</text>
<text x="60" y="246" class="s" font-size="30" font-weight="600"><tspan fill="#e2e8f0">Full-Stack Engineer</tspan><tspan fill="#64748b">  →  </tspan><tspan fill="#a78bfa">AI Engineer</tspan></text>
<text x="60" y="296" class="m" font-size="22" fill="#67e8f9" opacity="0">&gt; building production-grade systems<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.28;0.34;1" dur="9s" begin="0s" repeatCount="indefinite"/></text><text x="60" y="296" class="m" font-size="22" fill="#67e8f9" opacity="0">&gt; React · Next.js · Node · FastAPI<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.28;0.34;1" dur="9s" begin="3s" repeatCount="indefinite"/></text><text x="60" y="296" class="m" font-size="22" fill="#67e8f9" opacity="0">&gt; learning in public, shipping with proof<animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.06;0.28;0.34;1" dur="9s" begin="6s" repeatCount="indefinite"/></text>
<rect x="60" y="332" width="188" height="38" rx="19" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/><text x="154.0" y="357" class="m" font-size="18" text-anchor="middle" fill="#cbd5e1">BSCS · Larkano</text>
<rect x="260" y="332" width="177" height="38" rx="19" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/><text x="348.5" y="357" class="m" font-size="18" text-anchor="middle" fill="#cbd5e1">Class of 2028</text>
<rect x="449" y="332" width="221" height="38" rx="19" fill="#fff" fill-opacity=".06" stroke="#fff" stroke-opacity=".14"/><text x="559.5" y="357" class="m" font-size="18" text-anchor="middle" fill="#cbd5e1">Coding since 2024</text>
<g transform="translate(800 230)">
