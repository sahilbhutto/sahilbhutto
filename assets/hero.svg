<circle r="52" fill="none" stroke="#22d3ee" stroke-opacity=".7" stroke-width="2" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="16s" repeatCount="indefinite"/></circle>
<text y="14" class="s" font-size="40" font-weight="800" text-anchor="middle" fill="#e9d5ff">AI</text>
