<circle r="130" fill="#22d3ee" opacity="0.35"><animate attributeName="cx" values="790;640;790" dur="16s" repeatCount="indefinite"/><animate attributeName="cy" values="340;260;340" dur="13s" repeatCount="indefinite"/></circle>
<circle r="90" fill="#f472b6" opacity="0.35"><animate attributeName="cx" values="830;700;830" dur="12s" repeatCount="indefinite"/><animate attributeName="cy" values="50;110;50" dur="9s" repeatCount="indefinite"/></circle>
</g>
