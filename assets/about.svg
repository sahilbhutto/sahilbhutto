<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 656" width="1000" height="656" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
<title id="t">About Sahil Ali Bhutto</title>
<desc id="d">I started on the frontend with HTML, CSS, JavaScript and React, then moved to full-stack development to own what happens behind the interface: APIs, databases and validation. Backend engineering is where I spend most of my time, with Node.js and Express today and Python with FastAPI next. I care about layered architecture, clean data models and maintainable code. My goal is to build AI engineering on top of that base, with LLM applications, RAG and agents, and become a production-ready Full-Stack AI Engineer by 2028. Computer Science student at the University of Larkano, 4th semester, expected graduation 2028, based in Pakistan. 2nd position in the Theory of Programming Languages test. 3 featured projects.</desc>
