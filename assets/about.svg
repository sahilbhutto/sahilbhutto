 fill="#F1F5FF" text-anchor="middle">Sahil Ali Bhutto</text><text x="800" y="205" font-size="15" fill="#22D3EE" text-anchor="middle" font-family="'JetBrains Mono','SF Mono',Consolas,Menlo,monospace">@sahilbhutto</text><line x1="670" y1="224" x2="930" y2="224" stroke="#fff" stroke-opacity=".12"/><text x="670" y="252" font-size="13" fill="#8A97B5">Location</text><text x="670" y="274" font-size="16.5" font-weight="600" fill="#E6EDF7">Pakistan</text><text x="670" y="300" font-size="13" fill="#8A97B5">University</text><text x="670" y="322" font-size="16.5" font-weight="600" fill="#E6EDF7">University of Larkano</text><text x="670" y="348" font-size="13" fill="#8A97B5">Degree</text><text x="670" y="370" font-size="16.5" font-weight="600" fill="#E6EDF7">BS Computer Science</text><text x="670" y="396" font-size="13" fill="#8A97B5">Focus</text><text x="670" y="418" font-size="16.5" font-weight="600" fill="#E6EDF7">Full-Stack and Backend</text><text x="670" y="444" font-size="13" fill="#8A97B5">Goal</text><text x="670" y="466" font-size="16.5" font-weight="600" fill="#E6EDF7">Full-Stack AI Engineer</text><rect x="40" y="530" width="212" height="96" rx="16" fill="#fff" fill-opacity=".05" stroke="#3B82F6" stroke-opacity=".4"/><text x="60" y="568" font-size="30" font-weight="800" fill="url(#ac)">4th</text><text x="60" y="592" font-size="12.5" fill="#C9D6F2">semester</text><rect x="276" y="530" width="212" height="96" rx="16" fill="#fff" fill-opacity=".05" stroke="#3B82F6" stroke-opacity=".4"/><text x="296" y="568" font-size="30" font-weight="800" fill="url(#ac)">2028</text><text x="296" y="592" font-size="12.5" fill="#C9D6F2">expected graduation</text><rect x="512" y="530" width="212" height="96" rx="16" fill="#fff" fill-opacity=".05" stroke="#3B82F6" stroke-opacity=".4"/><text x="532" y="568" font-size="30" font-weight="800" fill="url(#ac)">2nd</text><text x="532" y="592" font-size="12.5" fill="#C9D6F2">position, Theory of</text><text x="532" y="608" font-size="12.5" fill="#C9D6