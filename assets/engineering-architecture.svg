<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590" width="1000" height="590" role="img" aria-labelledby="t d" font-family="Inter,'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif">
<title id="t">Layered software architecture and engineering focus areas</title>
<desc id="d">Five stacked layers: presentation, application, business logic, data access, and database and infrastructure, next to fourteen engineering focus areas grouped as fundamentals, design, security and quality, and production.</desc>
