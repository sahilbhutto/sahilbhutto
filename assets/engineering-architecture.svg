04" font-size="17" font-weight="700" fill="#F1F5FF">Data access layer</text><text x="66" y="426" font-size="12.5" fill="#8A97B5">Mongoose, SQLAlchemy, Alembic migrations</text><line x1="255" y1="447" x2="255" y2="457" stroke="#8A97B5" stroke-width="1.6"/><polygon points="255,463 251,456 259,456" fill="#8A97B5"/><rect x="40" y="466" width="430" height="72" rx="14" fill="#0E1A3A" stroke="#22D3EE" stroke-opacity=".5"/><rect x="40" y="480" width="4" height="44" rx="2" fill="#22D3EE"/><text x="66" y="498" font-size="17" font-weight="700" fill="#F1F5FF">Database and infrastructure</text><text x="66" y="520" font-size="12.5" fill="#8A97B5">MongoDB, PostgreSQL, Docker, Linux</text><rect x="500" y="90" width="235" height="52" rx="12" fill="#0E1A3A" stroke="#3B82F6" stroke-opacity=".4"/><circle cx="520" cy="116" r="5" fill="#3B82F6"/><text x="536" y="121" font-size="12.5" fill="#E6EDF7">Data Structures &amp; Algorithms</text><rect x="500" y="156" width="235" height="52" rx="12" fill="#0E1A3A" stroke="#3B82F6" stroke-opacity=".4"/><circle cx="520" cy="182" r="5" fill="#3B82F6"/><text x="536" y="187" font-size="12.5" fill="#E6EDF7">Object-Oriented Programming</text><rect x="500" y="222" width="235" height="52" rx="12" fill="#0E1A3A" stroke="#3B82F6" stroke-opacity=".4"/><circle cx="520" cy="248" r="5" fill="#3B82F6"/><text x="536" y="253" font-size="12.5" fill="#E6EDF7">Database Management Systems</text><rect x="500" y="288" width="235" height="52" rx="12" fill="#0E1A3A" stroke="#8B5CF6" stroke-opacity=".4"/><circle cx="520" cy="314" r="5" fill="#8B5CF6"/><text x="536" y="319" font-size="12.5" fill="#E6EDF7">API Design</text><rect x="500" y="354" width="235" height="52" rx="12" fill="#0E1A3A" stroke="#8B5CF6" stroke-opacity=".4"/><circle cx="520" cy="380" r="5" fill="#8B5CF6"/><text x="536" y="385" font-size="12.5" fill="#E6EDF7">Software Architecture</text><rect x="500" y="420" width="235" height="52" rx="12" fill="#0E1A3A" stroke="#8B5CF6" stroke-opacity=".4"/><circle cx="520