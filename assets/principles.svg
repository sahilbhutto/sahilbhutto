<svg xmlns="http://www.w3.org/2000/svg" width="720" height="392" viewBox="0 0 720 392" role="img" aria-label="principles">
<defs><style>.s{font-family:'Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif}.m{font-family:'SF Mono',Menlo,Consolas,'DejaVu Sans Mono','Liberation Mono',monospace}</style><linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12132e"/><stop offset="1" stop-color="#090913"/></linearGradient><linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".6"/><stop offset=".5" stop-color="#22d3ee" stop-opacity=".2"/><stop offset="1" stop-color="#f472b6" stop-opacity=".5"/></linearGradient><linearGradient id="brand" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#22d3ee"/><stop offset=".5" stop-color="#8b5cf6"/><stop offset="1" stop-color="#f472b6"/></linearGradient><linearGradient id="hl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b5cf6" stop-opacity=".9"/><stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/></linearGradient><linearGradient id="mv" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".04"/></pattern><filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="42"/></filter></defs>
<rect width="720" height="392" rx="22" fill="url(#card)"/><rect width="720" height="392" rx="22" fill="url(#grid)"/><rect x=".75" y=".75" width="718.5" height="390.5" rx="22" fill="none" stroke="url(#bd)" stroke-width="1.5"/><text x="36" y="78" class="m" font-size="40" font-weight="800" fill="#22d3ee" fill-opacity=".9">01</text><text x="112" y="62" class="s" font-size="24" font-weight="700" fill="#f8fafc">Understand before generating</text><text x="112" y="90" class="s" font-size="16" fill="#94a3b8">Read the error. Check the logs. Reproduce the bug.</text><rect x="36" y="110" width="648" height="1" fill="#fff" fill-opacity=".07"/><text x="36" y="166" class="m" font-size="40" font-weight="800" fill="#8b5cf6" fill-opacity=".9">02</text><text x="112" y="150" class="s" font-size="24" font-weight="700" fill="#f8fafc">Security by default</text><text x="112" y="178" class="s" font-size="16" fill="#94a3b8">Validation, authn / authz, secrets management.</text><rect x="36" y="198" width="648" height="1" fill="#fff" fill-opacity=".07"/><text x="36" y="254" class="m" font-size="40" font-weight="800" fill="#f472b6" fill-opacity=".9">03</text><text x="112" y="238" class="s" font-size="24" font-weight="700" fill="#f8fafc">Structure over shortcuts</text><text x="112" y="266" class="s" font-size="16" fill="#94a3b8">Modular code, service layers, separation of concerns.</text><rect x="36" y="286" width="648" height="1" fill="#fff" fill-opacity=".07"/><text x="36" y="342" class="m" font-size="40" font-weight="800" fill="#34d399" fill-opacity=".9">04</text><text x="112" y="326" class="s" font-size="24" font-weight="700" fill="#f8fafc">Ship it</text><text x="112" y="354" class="s" font-size="16" fill="#94a3b8">Deployed, documented and tested beats 'works on my machine'.</text>
</svg>
